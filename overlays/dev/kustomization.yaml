apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shift-festival-dev

resources:
  - ../../base
  - namespace.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: cloudflare-tunnel-secret
    envs:
      - .env.cloudflare

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: ingress-nginx-controller
    patch: |-
      - op: replace
        path: /data/proxy-set-headers
        value: "shift-festival-dev/nginx-proxy-headers"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: ""
      version: v1
      kind: Service
      name: crm-receiver-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: elasticsearch-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: facturatie-proxy-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: frontend-proxy-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: kassa-proxy-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: kibana-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: pgadmin-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: planning-pgadmin-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: planning-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: rabbitmq-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
      - op: remove
        path: /spec/ports/1/nodePort
  - target:
      group: ""
      version: v1
      kind: Service
      name: ingress-nginx-controller-service
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
      - op: remove
        path: /spec/ports/1/nodePort
