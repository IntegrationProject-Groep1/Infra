# =============================================================================
# dev-on.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Starts OR updates the dev environment.
#   - If dev is already running (active in last 4h): resets the inactivity
#     timer so the environment stays up. ArgoCD handles the image update.
#   - If dev is off: pauses ArgoCD, starts services in phases to avoid CPU
#     spikes on the single-node VM, then re-enables ArgoCD sync.
#
# TRIGGERS:
#   - Manual (workflow_dispatch)
#   - Automatically when ArgoCD Image Updater detects a new :dev image
#     and updates overlays/dev/kustomization.yaml on main
# =============================================================================

name: Dev Environment — ON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'overlays/dev/kustomization.yaml'

jobs:
  dev-on:
    name: Start shift-festival-dev
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Enable dev-off schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable dev-off.yml --repo ${{ github.repository }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if dev is already running
        id: dev_status
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key_dev
          chmod 600 /tmp/ssh_key_dev

          LAST_ACTIVE=$(ssh -i /tmp/ssh_key_dev \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -p 60022 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "kubectl get configmap dev-last-active -n shift-festival-dev \
             -o jsonpath='{.data.timestamp}' 2>/dev/null || echo 0")

          rm -f /tmp/ssh_key_dev

          NOW=$(date +%s)
          if [[ "$LAST_ACTIVE" != "0" && $(( NOW - LAST_ACTIVE )) -lt 14400 ]]; then
            echo "Dev is already running — will skip phased startup"
            echo "running=true" >> $GITHUB_OUTPUT
          else
            echo "Dev is not running — will do full phased startup"
            echo "running=false" >> $GITHUB_OUTPUT
          fi

      - name: Already running — reset inactivity timer
        if: steps.dev_status.outputs.running == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            echo "Dev is already running — resetting inactivity timer"
            kubectl create configmap dev-last-active -n shift-festival-dev \
              --from-literal=timestamp=$(date +%s) \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✅ Timer reset — ArgoCD handles the image update"

      - name: Copy overlay to VM
        if: steps.dev_status.outputs.running == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          source: "overlays/dev/*"
          target: "/home/ehbstudent/shiftfestival/overlays/dev"
          strip_components: 2

      - name: Ensure namespace and secrets exist
        if: steps.dev_status.outputs.running == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            cd /home/ehbstudent/shiftfestival

            kubectl create namespace shift-festival-dev --dry-run=client -o yaml | kubectl apply -f -

            kubectl get secret shift-secrets -n shift-festival -o json \
              | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations) | .metadata.namespace="shift-festival-dev"' \
              | kubectl apply -f -

            if ! kubectl get secret rabbitmq-definitions -n shift-festival-dev &>/dev/null; then
              kubectl get secret rabbitmq-definitions -n shift-festival -o json \
                | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations) | .metadata.namespace="shift-festival-dev"' \
                | kubectl apply -f -
            fi

            if ! kubectl get secret cloudflare-tunnel-secret -n shift-festival-dev &>/dev/null; then
              kubectl get secret cloudflare-tunnel-secret -n shift-festival -o json \
                | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations) | .metadata.namespace="shift-festival-dev"' \
                | kubectl apply -f -
            fi

            DEV_VHOST=$(echo -n 'shift-festival-dev' | base64)
            EMPTY=$(echo -n '' | base64)
            kubectl patch secret shift-secrets -n shift-festival-dev \
              --type=json \
              -p='[
                {"op":"replace","path":"/data/RABBITMQ_VHOST","value":"'"$DEV_VHOST"'"},
                {"op":"replace","path":"/data/RABBIT_VHOST","value":"'"$DEV_VHOST"'"},
                {"op":"replace","path":"/data/SENDGRID_API_KEY","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SMTP_USERNAME","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SMTP_PASSWORD","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SF_CLIENT_ID","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SF_CLIENT_SECRET","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SF_INSTANCE_URL","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/SF_REFRESH_TOKEN","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_CRM","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_FACTURATIE","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_FRONTEND","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_INFRA","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_KASSA","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_MONITORING","value":"'"$EMPTY"'"},
                {"op":"replace","path":"/data/TEAMS_WEBHOOK_PLANNING","value":"'"$EMPTY"'"}
              ]'

            kubectl create configmap dev-last-active -n shift-festival-dev \
              --from-literal=timestamp=$(date +%s) \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply overlay and scale to zero
        if: steps.dev_status.outputs.running == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            cd /home/ehbstudent/shiftfestival

            echo "Pausing ArgoCD sync during phased startup..."
            kubectl patch application shift-festival-dev -n argocd \
              --type=merge -p '{"spec":{"syncPolicy":{"automated":null}}}' 2>/dev/null || true

            kubectl apply -k overlays/dev --prune=false 2>/dev/null || true

            kubectl scale deployment --all -n shift-festival-dev --replicas=0 2>/dev/null || true
            kubectl scale statefulset --all -n shift-festival-dev --replicas=0 2>/dev/null || true

      - name: Phase 1 — Core (RabbitMQ + databases)
        if: steps.dev_status.outputs.running == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            echo "Phase 1 — Starting RabbitMQ and databases..."

            kubectl scale deployment rabbitmq-broker -n shift-festival-dev --replicas=1
            sleep 30
            kubectl scale deployment postgredb frontend-db kassa-db facturatie-db crm-db planning-db -n shift-festival-dev --replicas=1

            echo "Waiting for RabbitMQ..."
            kubectl rollout status deployment/rabbitmq-broker -n shift-festival-dev --timeout=5m

            echo "Creating dev vhost in RabbitMQ..."
            RABBITMQ_POD=$(kubectl get pod -n shift-festival-dev -l app=rabbitmq -o jsonpath='{.items[0].metadata.name}')
            kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- rabbitmqctl add_vhost shift-festival-dev 2>/dev/null || true
            for user in crm_rabbitmq facturatie_rabbitmq frontend_rabbitmq guest identity_user infra_admin kassa_rabbitmq monitoring_rabbitmq planning_rabbitmq chatbot_rabbitmq; do
              kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- rabbitmqctl set_permissions -p shift-festival-dev "$user" ".*" ".*" ".*" 2>/dev/null || true
            done

            echo "Ensuring chatbot_rabbitmq user exists with correct credentials..."
            CHATBOT_PASS=$(kubectl get secret shift-secrets -n shift-festival-dev -o jsonpath='{.data.RABBITMQCHATBOT_PASS}' | base64 -d)
            kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- rabbitmqctl add_user chatbot_rabbitmq "$CHATBOT_PASS" 2>/dev/null || \
              kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- rabbitmqctl change_password chatbot_rabbitmq "$CHATBOT_PASS"
            kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- rabbitmqctl set_permissions -p shift-festival-dev chatbot_rabbitmq ".*" ".*" ".*"

            echo "Clearing default vhost queues to avoid definition conflicts..."
            for queue in $(kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- \
              rabbitmqctl list_queues -p / name --no-table-headers 2>/dev/null | awk '{print $1}'); do
              kubectl exec "$RABBITMQ_POD" -n shift-festival-dev -- \
                rabbitmqctl delete_queue "$queue" --vhost / 2>/dev/null || true
            done
            echo "✅ Phase 1 done"

      - name: Phase 2 — Applications
        if: steps.dev_status.outputs.running == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            echo "Phase 2 — Starting applications..."

            kubectl scale deployment cloudflared -n shift-festival-dev --replicas=1

            for rollout in frontend-drupal kassa-web fossbilling-app identity-service integration-crm integration-planning kassa-integration chatbot frontend-mcp kassa-mcp facturatie-mcp crm-mcp monitoring-mcp; do
              kubectl patch rollout $rollout -n shift-festival-dev \
                --type=merge -p '{"spec":{"replicas":1}}' 2>/dev/null || true
              sleep 5
            done

            kubectl scale deployment frontend-proxy kassa-proxy facturatie-proxy chatbot-proxy -n shift-festival-dev --replicas=1

            echo "Re-enabling ArgoCD sync..."
            kubectl patch application shift-festival-dev -n argocd \
              --type=merge -p '{"spec":{"syncPolicy":{"automated":{"prune":false,"selfHeal":false}}}}' 2>/dev/null || true

            echo ""
            echo "✅ Dev environment is UP"
            echo "Frontend:   https://dev.desiderius.me"
            echo "Kassa:      https://dev-kassa.desiderius.me"
            echo "Facturatie: https://dev-facturatie.desiderius.me"
            echo "Chatbot:    https://dev-chatbot.desiderius.me"
