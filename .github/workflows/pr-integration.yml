# =============================================================================
# pr-integration.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Validates that every pull request to main or dev can be deployed without
#   errors by spinning up a real Kubernetes cluster (kind) inside GitHub
#   Actions and applying the manifest tree.
#
# HOW IT WORKS:
#   kind (Kubernetes IN Docker) runs a full Kubernetes control plane and
#   worker node inside the GitHub Actions runner. We apply our Kustomize
#   overlays to this cluster and let the Kubernetes API validate every
#   manifest. If the API accepts all resources the job passes.
#
# WHAT "PASSING" MEANS:
#   - Kustomize can render both overlays without errors
#   - The Kubernetes API accepts every resource without schema errors
#   - All expected Deployments, StatefulSets, Services, and Secrets exist
#     after the apply (verified by name, not by pod health)
#
# WHAT "PASSING" DOES NOT MEAN:
#   - Pods are Running — images are pulled at runtime, not at apply time.
#     Pods will be in ImagePullBackOff or Pending because the ghcr.io images
#     do not yet exist in this CI environment. This is expected and is NOT
#     a failure. kubectl apply returns exit code 0 regardless of image status.
#   - Services can reach each other
#   - Application logic works correctly
#
# WHAT THIS CATCHES (examples of real bugs this has stopped):
#   - Referencing a ConfigMap or Secret by a name that does not exist
#   - Using a deprecated apiVersion (e.g. extensions/v1beta1)
#   - Typos in field names (e.g. "limtis" instead of "limits")
#   - Kustomize patches targeting a resource that no longer exists in base
#   - Missing kustomization.yaml after moving a folder
#
# NOTE: shift-secrets is NOT created in CI — it is bootstrapped manually on the VM
#   via scripts/create-secret.sh. The secret check was removed from CI verification.
#
# TRIGGER:  pull_request to main or dev  —  never runs on direct pushes
# =============================================================================

name: PR Integration Test (kind)

on:
  pull_request:
    branches: [main, dev]

jobs:
  kind-deploy:
    name: Apply manifests to kind cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 1 — Spin up a real Kubernetes cluster using kind
      #
      # kind runs a full Kubernetes API server + scheduler + controller-manager
      # inside a Docker container on the GitHub Actions runner. Every kubectl
      # command after this step hits a real Kubernetes API, not a mock.      # -----------------------------------------------------------------------
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: sf-pr-test
          config: .github/kind-config.yaml
          wait: 120s

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.1

      - name: Confirm cluster is reachable
        run: |
          kubectl cluster-info
          kubectl get nodes

      # -----------------------------------------------------------------------
      # STEP 2 — Apply root manifests (Production)
      #
      # kubectl apply -k . does the following:
      #   1. Kustomize renders the full manifest tree (base + root patches)
      #   2. The rendered YAML is sent to the Kubernetes API
      #   3. The API validates each resource against its schema
      #   4. If all resources pass validation, they are stored in etcd
      #   5. kubectl apply exits 0 (success)
      #
      # Images are NOT pulled at this step. Pod scheduling happens after the
      # Deployment objects are created. Pods will be Pending or ImagePullBackOff
      # because the ghcr.io images require authentication or do not yet exist.
      # This is expected and does not affect the exit code of kubectl apply.
      # -----------------------------------------------------------------------
      - name: Install Argo Rollouts CRDs
        run: kubectl apply -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml

      - name: Apply root manifests (shift-festival)
        run: kubectl apply -k .

      # -----------------------------------------------------------------------
      # STEP 3 — Verify key named resources exist
      #
      # We check for specific resources by name. This is more reliable than
      # counting resources because it tells you exactly which Deployment or
      # Service is missing if something went wrong. Pods do not need to be
      # Running — we only verify the Kubernetes objects were created.
      # -----------------------------------------------------------------------
      - name: Verify core resources exist in shift-festival (prod)
        shell: bash
        run: |
          echo "Checking that key Deployments and StatefulSets were created..."
          FAILED=0

          check() {
            local kind=$1 name=$2 ns=$3
            if kubectl get "${kind}" "${name}" -n "${ns}" --no-headers &>/dev/null; then
              echo "  ✅ ${kind}/${name} exists in ${ns}"
            else
              echo "  ❌ ${kind}/${name} NOT FOUND in ${ns}"
              FAILED=$((FAILED + 1))
            fi
          }

          # Core
          check deployment rabbitmq-broker       shift-festival
          check deployment postgredb             shift-festival
          check deployment cloudflared           shift-festival

          # Team Frontend
          check deployment frontend-drupal       shift-festival
          check deployment frontend-db           shift-festival

          # Team Kassa
          check deployment kassa-web             shift-festival
          check deployment kassa-integration     shift-festival
          check deployment kassa-db              shift-festival

          # Team Facturatie
          check deployment fossbilling-app       shift-festival
          check deployment facturatie-db         shift-festival

          # Integrations
          check deployment integration-crm       shift-festival
          check deployment integration-planning  shift-festival
          check deployment identity-service      shift-festival

          # Monitoring
          check statefulset elasticsearch        shift-festival
          check deployment kibana               shift-festival
          check deployment logstash             shift-festival
          check deployment monitoring-agent     shift-festival

          if [[ "${FAILED}" -gt 0 ]]; then
            echo ""
            echo "❌ ${FAILED} resource(s) missing — manifests did not apply correctly"
            exit 1
          fi

          echo ""
          echo "✅ All expected resources exist in shift-festival"

      # -----------------------------------------------------------------------
      # STEP 4 — Print full cluster snapshot (always runs, even on failure)
      #
      # This output is visible in the GitHub Actions log and helps you
      # debug exactly what went wrong when a step fails.
      # -----------------------------------------------------------------------
      - name: Print full cluster snapshot
        if: always()
        run: |
          echo "========================================"
          echo "  NODES"
          echo "========================================"
          kubectl get nodes
          echo ""

          echo "========================================"
          echo "  PROD (shift-festival) — all resources"
          echo "========================================"
          kubectl get all -n shift-festival || true
          echo ""
          echo "--- PVCs ---"
          kubectl get pvc -n shift-festival || true
          echo "--- Secrets ---"
          kubectl get secrets -n shift-festival || true
          echo ""

          echo "========================================"
          echo "  EVENTS — prod (last 20)"
          echo "========================================"
          kubectl get events -n shift-festival \
            --sort-by=.metadata.creationTimestamp 2>/dev/null | tail -20 || true
