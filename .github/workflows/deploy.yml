# =============================================================================
# deploy.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Deploys the Kubernetes stack to the Azure VM on every push to main after
#   CI passes, or on manual trigger. After applying the manifests it runs
#   rollout checks and notifies Teams on success or failure.
# =============================================================================

name: Deploy Infra to Kubernetes

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "OVERLAY=overlays/prod" >> $GITHUB_ENV
            echo "NAMESPACE=shift-festival" >> $GITHUB_ENV
          else
            echo "OVERLAY=overlays/dev" >> $GITHUB_ENV
            echo "NAMESPACE=shift-festival-dev" >> $GITHUB_ENV
          fi

      - name: Copy files to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          source: "./*"
          target: "shiftfestival"
          exclude: ".github,assets,README.md,*.md,CLAUDE.md,DOCUMENTATION.md,SECURITY.md"

      - name: Verify kubectl is available on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            command -v kubectl >/dev/null 2>&1 || { echo "kubectl is not installed on the VM"; exit 1; }

      - name: Apply manifests and wait for rollouts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            cd shiftfestival

            if [[ ! -f setup/.env ]]; then
              echo "setup/.env is missing on the VM. Create it before deploying."
              exit 1
            fi

            echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" \
              > ~/shiftfestival/setup/.env.cloudflare

            kubectl apply -k ${{ env.OVERLAY }}

            # ArgoCD manages rollout health and self-healing from this point.
            # We only verify the critical shared infrastructure comes up cleanly.
            echo "Waiting for core infrastructure in ${{ env.NAMESPACE }}..."
            kubectl rollout status deployment/rabbitmq-broker -n ${{ env.NAMESPACE }} --timeout=5m
            kubectl rollout status deployment/postgredb       -n ${{ env.NAMESPACE }} --timeout=5m

            echo "Manifests applied. ArgoCD will track full rollout health."
            echo "Check status at: https://argocd.desiderius.me"

            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get svc  -n ${{ env.NAMESPACE }}


