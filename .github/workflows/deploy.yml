# =============================================================================
# deploy.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Verifies cluster connectivity after a push to main/dev.
#   ArgoCD handles all actual deployments via GitOps — this workflow
#   no longer runs kubectl apply to prevent mass pod restarts.
# =============================================================================

name: Deploy Infra to Kubernetes

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "OVERLAY=overlays/prod" >> $GITHUB_ENV
            echo "NAMESPACE=shift-festival" >> $GITHUB_ENV
          else
            echo "OVERLAY=overlays/dev" >> $GITHUB_ENV
            echo "NAMESPACE=shift-festival-dev" >> $GITHUB_ENV
          fi

      - name: Verify kubectl is available on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            command -v kubectl >/dev/null 2>&1 || { echo "kubectl is not installed on the VM"; exit 1; }

      - name: Verify core infrastructure is healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail

            echo "ArgoCD manages all deployments via GitOps."
            echo "Verifying core infrastructure in ${{ env.NAMESPACE }}..."

            kubectl rollout status deployment/rabbitmq-broker -n ${{ env.NAMESPACE }} --timeout=5m
            kubectl rollout status deployment/postgredb       -n ${{ env.NAMESPACE }} --timeout=5m

            echo "Core infrastructure healthy. ArgoCD tracks full rollout health."
            echo "Check status at: https://argocd.desiderius.me"

            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get svc  -n ${{ env.NAMESPACE }}
