# =============================================================================
# ci.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Validates the Infra repository on every push and pull request.
#   Catches configuration errors, security issues, and bad practices
#   BEFORE they reach the VM / Kubernetes cluster.
#
# JOBS:
#   1. validate - Kustomize rendering and YAML syntax checks
#   2. lint     - Bash script linting with shellcheck
#   3. security - Secret scanning and Kubernetes misconfiguration checks
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "prod", "fix/ci"]
    tags: ["v*"]
    paths-ignore:
      - 'overlays/**/.argocd-source-*.yaml'
  pull_request:
    branches: ["main", "dev", "prod", "fix/ci"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate configuration files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.1

      - name: Render Kubernetes manifests
        shell: bash
        run: |
          # secretGenerator has been removed — overlays no longer need .env files to render.
          # Secrets are bootstrapped separately via scripts/create-secret.sh on the VM.

          echo "CLOUDFLARE_TUNNEL_TOKEN=ci_placeholder" > overlays/prod/.env.cloudflare

          echo "Rendering base..."
          kubectl kustomize base > /dev/null

          echo "Rendering overlays/prod..."
          kubectl kustomize overlays/prod > "${RUNNER_TEMP}/rendered-manifests-prod.yaml"

          echo "Rendering overlays/dev..."
          echo "CLOUDFLARE_TUNNEL_TOKEN=ci_placeholder" > overlays/dev/.env.cloudflare
          kubectl kustomize overlays/dev > "${RUNNER_TEMP}/rendered-manifests-dev.yaml"

          echo "Rendering root manifests..."          kubectl kustomize . > "${RUNNER_TEMP}/rendered-manifests-root.yaml"

          rm -f overlays/prod/.env.cloudflare overlays/dev/.env.cloudflare

          echo "✅ Kustomize render completed"      - name: Lint YAML files
        shell: bash
        run: |
          # Install yamllint
          pip install yamllint --quiet
          
          # Lint all YAML files, excluding auto-generated ArgoCD files
          # Using -not -path to exclude unwanted files, and ignoring find permission errors
          find . \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -not -path "*/.argocd-source-*.yaml" \
            2>/dev/null | while IFS= read -r file; do
            yamllint -d "{
              extends: relaxed,
              rules: {
                line-length: {max: 300},
                truthy: disable,
                comments: disable,
                comments-indentation: disable,
                indentation: disable,
                braces: disable,
                brackets: disable,
                colons: disable,
                commas: disable,
                document-start: disable,
                empty-lines: disable,
                new-line-at-end-of-file: disable,
                trailing-spaces: disable
              }
            }" "$file"
          done

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        shell: bash
        run: |
          while IFS= read -r script; do
            shellcheck --exclude=SC2034,SC1091 --severity=warning "${script}"
          done < <(find scripts -name "*.sh" -type f)

  security:
    name: Security scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Kubernetes manifests with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL
          format: table
          skip-dirs: argocd

      - name: Verify sensitive files are not committed
        shell: bash
        run: |
          COMMITTED_ENV=$(git ls-files | grep -E '(^|/)\.env$|(^|/)setup/\.env$' || true)
          if [[ -n "${COMMITTED_ENV}" ]]; then
            echo "❌ .env files must not be committed"
            echo "${COMMITTED_ENV}"
            exit 1
          fi
          echo "✅ No .env files are tracked"

      - name: Check for hardcoded credentials
        shell: bash
        run: |
          ERRORS=0
          while IFS= read -r pattern; do
            matches=$(grep -rEi "${pattern}" \
              --include="*.yml" \
              --include="*.yaml" \
              --include="*.conf" \
              --include="*.sh" \
              --exclude-dir=".git" \
              --exclude-dir=".github" \
              --exclude="*.example" \
              . 2>/dev/null || true)
            if [[ -n "${matches}" ]]; then
              echo "❌ Potential hardcoded secret found:"
              echo "${matches}"
              ERRORS=$((ERRORS + 1))
            fi
          done <<'EOF'
          [Pp]assword\s*[:=]\s*[A-Za-z0-9_@./-]{6,}
          [Tt]oken\s*[:=]\s*[A-Za-z0-9_@./-]{10,}
          [Ss]ecret\s*[:=]\s*[A-Za-z0-9_@./-]{10,}
          EOF

          if [[ ${ERRORS} -gt 0 ]]; then
            exit 1
          fi

      - name: Check for obvious Kubernetes misconfigurations
        shell: bash
        run: |
          echo "Checking for privileged containers and dangerous host ports..."

          if grep -RIn "privileged:[[:space:]]*true" --include="*.yml" --include="*.yaml" .; then
            echo "❌ CRITICAL: privileged containers are not allowed"
            exit 1
          fi

          if grep -RInE 'nodePort:[[:space:]]*22|hostPort:[[:space:]]*22' --include="*.yml" --include="*.yaml" .; then
            echo "❌ CRITICAL: SSH must not be exposed through Kubernetes services"
            exit 1
          fi

          echo "✅ No obvious misconfigurations found"
