# =============================================================================
# ci.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Validates the Infra repository on every push and pull request.
#   Catches configuration errors, security issues, and bad practices
#   BEFORE they reach the VM / Kubernetes cluster.
#
# JOBS:
#   1. validate - Kustomize rendering and YAML syntax checks
#   2. lint     - Bash script linting with shellcheck
#   3. security - Secret scanning and Kubernetes misconfiguration checks
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "prod", "fix/ci"]
    tags: ["v*"]
    paths-ignore:
      # ArgoCD Image Updater commits new image digests to kustomization.yaml on
      # every image update. Excluding this file prevents CI from triggering on
      # those automated commits — they contain no logic changes and would only
      # add noise without any useful validation.
      - 'kustomization.yaml'
  pull_request:
    branches: ["main", "dev", "prod", "fix/ci"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate configuration files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.1

      - name: Render Kubernetes manifests
        shell: bash
        run: |
          # secretGenerator has been removed — overlays no longer need .env files to render.
          # Secrets are bootstrapped separately via scripts/create-secret.sh on the VM.

          echo "Rendering base..."
          kubectl kustomize base > /dev/null

          echo "Rendering root manifests (Production)..."
          kubectl kustomize . > "${RUNNER_TEMP}/rendered-manifests.yaml"

          echo "✅ Kustomize render completed"

      - name: Lint YAML files
        shell: bash
        run: |
          # Install yamllint
          pip install yamllint --quiet
          
          # argocd/install.yaml and .argocd-source-*.yaml are auto-generated
          # upstream files — linting them produces hundreds of false positives
          # that have nothing to do with our own configuration quality.
          find . \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -not -path "*/.argocd-source-*.yaml" \
            -not -path "./argocd/install.yaml" \
            2>/dev/null | while IFS= read -r file; do
            yamllint -d "{
              extends: relaxed,
              rules: {
                # Kubernetes manifests regularly exceed 120 chars in annotation
                # values and image references. The default of 80 would fire on
                # virtually every file without improving anything.
                line-length: {max: 300},
                # Kubernetes uses bare 'true'/'false' booleans as well as the
                # YAML 1.1 truthy aliases 'yes'/'no' (e.g. in some Helm-generated
                # manifests). Disabling avoids false positives on valid YAML.
                truthy: disable,
                # Comment style rules are purely cosmetic and inconsistent across
                # the auto-generated vendor files we include (ArgoCD Image Updater,
                # metrics-server). Disabling keeps the signal-to-noise ratio high.
                comments: disable,
                comments-indentation: disable,
                # Kubernetes indentation is conventionally 2 spaces, but nested
                # multiline values and some kubectl output deviate. The relaxed
                # preset already handles the common cases; this prevents the
                # remainder from failing the pipeline on style-only issues.
                indentation: disable,
                braces: disable,
                brackets: disable,
                colons: disable,
                commas: disable,
                document-start: disable,
                empty-lines: disable,
                new-line-at-end-of-file: disable,
                trailing-spaces: disable
              }
            }" "$file"
          done

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        shell: bash
        run: |
          # SC2034: "variable appears unused" — fires on variables that are exported
          #         for use by child processes or are conditionally referenced. These
          #         are false positives in scripts that set up environments.
          # SC1091: "not following source" — shellcheck cannot follow dynamic source
          #         paths like `source .env` at CI time because the file does not
          #         exist in the runner. Suppressing prevents false "undefined variable"
          #         errors for every variable loaded from .env.
          while IFS= read -r script; do
            shellcheck --exclude=SC2034,SC1091 --severity=warning "${script}"
          done < <(find scripts -name "*.sh" -type f)

  security:
    name: Security scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 fetches the complete git history. Gitleaks must scan
          # every commit, not just the latest — a secret committed and later
          # deleted is still in the history and must be caught.
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v1.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Kubernetes manifests with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL
          format: table
          # argocd/ contains the upstream ArgoCD install.yaml — a vendored
          # manifest maintained by the ArgoCD project. It intentionally runs
          # privileged init containers and mounts host paths as part of its
          # own design. Scanning it produces HIGH findings that are not
          # actionable by us. Our own manifests (base/) are fully scanned.
          skip-dirs: argocd

      - name: Verify sensitive files are not committed
        shell: bash
        run: |
          COMMITTED_ENV=$(git ls-files | grep -E '(^|/)\.env$|(^|/)setup/\.env$' || true)
          if [[ -n "${COMMITTED_ENV}" ]]; then
            echo "❌ .env files must not be committed"
            echo "${COMMITTED_ENV}"
            exit 1
          fi
          echo "✅ No .env files are tracked"

      - name: Check for hardcoded credentials
        shell: bash
        run: |
          ERRORS=0
          while IFS= read -r pattern; do
            matches=$(grep -rEi "${pattern}" \
              --include="*.yml" \
              --include="*.yaml" \
              --include="*.conf" \
              --include="*.sh" \
              --exclude-dir=".git" \
              --exclude-dir=".github" \
              --exclude-dir="argocd" \
              --exclude="*.example" \
              . 2>/dev/null || true)
            if [[ -n "${matches}" ]]; then
              echo "❌ Potential hardcoded secret found:"
              echo "${matches}"
              ERRORS=$((ERRORS + 1))
            fi
          done <<'EOF'
          [Pp]assword\s*[:=]\s*[A-Za-z0-9_@./-]{6,}
          [Tt]oken\s*[:=]\s*[A-Za-z0-9_@./-]{10,}
          [Ss]ecret\s*[:=]\s*[A-Za-z0-9_@./-]{10,}
          EOF

          if [[ ${ERRORS} -gt 0 ]]; then
            exit 1
          fi

      - name: Check for obvious Kubernetes misconfigurations
        shell: bash
        run: |
          echo "Checking for privileged containers and dangerous host ports..."

          if grep -RIn "privileged:[[:space:]]*true" --include="*.yml" --include="*.yaml" .; then
            echo "❌ CRITICAL: privileged containers are not allowed"
            exit 1
          fi

          if grep -RInE 'nodePort:[[:space:]]*22|hostPort:[[:space:]]*22' --include="*.yml" --include="*.yaml" .; then
            echo "❌ CRITICAL: SSH must not be exposed through Kubernetes services"
            exit 1
          fi

          echo "✅ No obvious misconfigurations found"
