# =============================================================================
# dev-off.yml
# ShiftFestival - Infra Team
#
# PURPOSE:
#   Stops the dev environment by suspending the ArgoCD Application when
#   no activity has been detected on the Feature-dev-environment branch
#   for 4 hours. The timer is shared across all teams — as long as any
#   team pushes, the dev env stays up.
#
# TRIGGERS:
#   - Manual (workflow_dispatch)
#   - Every 2 hours (schedule) — checks 4h inactivity since last dev-on
# =============================================================================

name: Dev Environment — OFF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  dev-off:
    name: Stop shift-festival-dev
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write

    steps:
      - name: Check inactivity
        if: github.event_name == 'schedule'
        id: inactivity
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          LAST_ACTIVE=$(ssh -i /tmp/ssh_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -p 60022 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "kubectl get configmap dev-last-active -n shift-festival-dev \
             -o jsonpath='{.data.timestamp}' 2>/dev/null || echo 0")

          rm -f /tmp/ssh_key

          if [[ "$LAST_ACTIVE" == "0" ]]; then
            echo "No dev-last-active ConfigMap found — dev env is already down"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST_ACTIVE) / 3600 ))
          echo "Hours since last dev-on: $DIFF"

          if [[ $DIFF -lt 4 ]]; then
            echo "Dev env activated $DIFF hour(s) ago — stays up"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Dev env has been up for $DIFF hour(s) — shutting down"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Scale down workloads
        if: github.event_name == 'workflow_dispatch' || steps.inactivity.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail

            if ! kubectl get application shift-festival-dev -n argocd &>/dev/null; then
              echo "ArgoCD app shift-festival-dev does not exist — nothing to do"
              exit 0
            fi

            echo "Scaling down all workloads..."
            kubectl scale deployment --all -n shift-festival-dev --replicas=0 2>/dev/null || true
            kubectl scale statefulset --all -n shift-festival-dev --replicas=0 2>/dev/null || true

            for rollout in $(kubectl get rollout -n shift-festival-dev \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl patch rollout "$rollout" -n shift-festival-dev \
                --type=merge -p '{"spec":{"replicas":0}}' 2>/dev/null || true
            done

            kubectl delete configmap dev-last-active -n shift-festival-dev 2>/dev/null || true

            echo ""
            echo "✅ Dev environment is DOWN"

      - name: Mark deployment inactive
        if: github.event_name == 'workflow_dispatch' || steps.inactivity.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENT_ID=$(gh api "repos/${{ github.repository }}/deployments?environment=shift-festival-dev&per_page=1" \
            --jq '.[0].id' 2>/dev/null || echo "")
          if [[ -n "$DEPLOYMENT_ID" && "$DEPLOYMENT_ID" != "null" ]]; then
            gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
              --method POST \
              -f state=inactive \
              -f description="Dev environment is OFF"
          fi

      - name: Disable dev-off schedule until next dev-on
        if: github.event_name == 'workflow_dispatch' || steps.inactivity.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable dev-off.yml --repo ${{ github.repository }}
