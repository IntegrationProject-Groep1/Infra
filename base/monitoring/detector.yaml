apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: detector
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 3m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: wait-for-elasticsearch
        image: curlimages/curl:8.10.1
        command:
        - sh
        - -c
        - |
          until curl -sf -u "elastic:${ELASTIC_PASSWORD}" http://elasticsearch-service:9200/_cluster/health; do
            echo "waiting for elasticsearch..."
            sleep 5
          done
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ELASTIC_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      containers:
      - name: detector
        image: ghcr.io/integrationproject-groep1/monitoring/detector:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: ES_HOST
          value: "http://elasticsearch-service:9200"
        - name: ES_ADMIN_USER
          value: "elastic"
        - name: ES_ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ELASTIC_PASSWORD
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQMONITORING_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQMONITORING_USER
        - name: RABBITMQMONITORING_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQMONITORING_PASS
        - name: RABBITMQ_VHOST
          value: "/"
        livenessProbe:
          exec:
            command: ["true"]
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          exec:
            command: ["true"]
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
