apiVersion: v1
kind: Secret
metadata:
  name: elastic-agent-config
stringData:
  elastic-agent.yml: |
    outputs:
      default:
        type: elasticsearch
        hosts:
          - "http://elasticsearch-service:9200"
        username: "elastic"
        password: "${ELASTICSEARCH_PASSWORD}"

    inputs:
      - type: system/metrics
        streams:
          - metricsets:
              - cpu
              - memory
              - filesystem
              - diskio
              - load
            period: 30s
            hostfs: /hostfs

      - type: kubernetes/metrics
        streams:
          - metricsets:
              - node
            period: 30s
            hosts:
              - "https://${NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
          - metricsets:
              - pod
            period: 30s
            hosts:
              - "https://${NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
          - metricsets:
              - container
            period: 30s
            hosts:
              - "https://${NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
