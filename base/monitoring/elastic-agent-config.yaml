apiVersion: v1
kind: Secret
metadata:
  name: elastic-agent-config
stringData:
  elastic-agent.yml: |
    outputs:
      default:
        type: elasticsearch
        hosts:
          - "http://elasticsearch-service:9200"
        username: "elastic"
        password: "${ELASTICSEARCH_PASSWORD}"

    inputs:
      - type: system/metrics
        streams:
          - metricsets:
              - cpu
              - memory
              - filesystem
              - diskio
              - load
            period: 30s
            hostfs: /hostfs

      - id: kubernetes-node-metrics
        type: kubernetes/metrics
        use_output: default
        meta:
          package:
            name: kubernetes
            version: 1.52.0
        data_stream:
          namespace: default
        streams:
          - data_stream:
              dataset: kubernetes.node
              type: metrics
            metricsets:
              - node
            period: 30s
            timeout: 10s
            hosts:
              - "https://${env.NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
          - data_stream:
              dataset: kubernetes.pod
              type: metrics
            metricsets:
              - pod
            period: 30s
            timeout: 10s
            hosts:
              - "https://${env.NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
            processors:
              - drop_event:
                  when:
                    or:
                      - equals:
                          kubernetes.pod.status.phase: "Succeeded"
                      - equals:
                          kubernetes.pod.status.phase: "Failed"
          - data_stream:
              dataset: kubernetes.container
              type: metrics
            metricsets:
              - container
            period: 30s
            timeout: 10s
            hosts:
              - "https://${env.NODE_NAME}:10250"
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            ssl.verification_mode: none
            add_metadata: true
            processors:
              - drop_event:
                  when:
                    or:
                      - equals:
                          kubernetes.pod.status.phase: "Succeeded"
                      - equals:
                          kubernetes.pod.status.phase: "Failed"
