apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: "elasticsearch"
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: copy-config
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        command: ["sh", "-c", "if [ ! -f /config-writable/elasticsearch.yml ]; then cp -r /usr/share/elasticsearch/config/. /config-writable/; fi"]
        securityContext:
          runAsUser: 1000
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: es-config
          mountPath: /config-writable
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 9200
          name: rest
        - containerPort: 9300
          name: inter-node
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "true"
        - name: xpack.security.http.ssl.enabled
          value: "false"
        - name: xpack.security.transport.ssl.enabled
          value: "false"
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ELASTIC_PASSWORD
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?local=true
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 10
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?local=true
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 30
          failureThreshold: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        - name: tmp
          mountPath: /tmp
        - name: es-config
          mountPath: /usr/share/elasticsearch/config
        - name: es-logs
          mountPath: /usr/share/elasticsearch/logs
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: es-data-pvc
      - name: tmp
        emptyDir: {}
      - name: es-config
        emptyDir: {}
      - name: es-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
spec:
  selector:
    app: elasticsearch
  ports:
    - name: rest
      port: 9200
      targetPort: 9200
      nodePort: 30060
    - name: inter-node
      port: 9300
      targetPort: 9300
  type: NodePort
