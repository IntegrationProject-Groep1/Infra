apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: integration-planning
spec:
  progressDeadlineSeconds: 120
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 3m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: planning
  template:
    metadata:
      labels:
        app: planning
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: planning
        image: ghcr.io/integrationproject-groep1/planning:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 30050
          protocol: TCP
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQ_USER_PLANNING
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQ_PASS_PLANNING
        - name: RABBITMQ_VHOST
          value: "/"
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: AZURE_CLIENT_ID
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: AZURE_CLIENT_SECRET
        - name: TOKEN_CACHE_FILE
          value: "/app/data/token_cache.json"
        - name: API_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: API_TOKEN_SECRET
        - name: TOKEN_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: TOKEN_ENCRYPTION_KEY
        - name: TEAMS_WEBHOOK_PLANNING
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: TEAMS_WEBHOOK_PLANNING
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 30050
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 30050
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: token-data
          mountPath: /app/data
      volumes:
      - name: token-data
        persistentVolumeClaim:
          claimName: planning-token-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: planning-service
spec:
  type: ClusterIP
  selector:
    app: planning
  ports:
    - port: 30050
      targetPort: 30050
