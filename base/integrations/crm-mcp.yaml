apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: crm-mcp
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 3m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: crm-mcp
  template:
    metadata:
      labels:
        app: crm-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: crm-mcp
        image: ghcr.io/integrationproject-groep1/crm:latest
        imagePullPolicy: Always
        command: ["node", "src/mcp_server.js"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8008
          protocol: TCP
        env:
        - name: SF_INSTANCE_URL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: SF_INSTANCE_URL
        - name: SF_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: SF_CLIENT_ID
        - name: SF_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: SF_CLIENT_SECRET
        - name: SF_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: SF_REFRESH_TOKEN
        - name: SF_API_VERSION
          value: "v60.0"
        - name: PORT
          value: "8008"
        readinessProbe:
          tcpSocket:
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8008
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crm-mcp-service
spec:
  selector:
    app: crm-mcp
  ports:
  - port: 8008
    targetPort: 8008
    nodePort: 30041
  type: NodePort
