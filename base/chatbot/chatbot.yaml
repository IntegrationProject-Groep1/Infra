apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: chatbot
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 3m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:

      # ── Main FastAPI app ───────────────────────────────────────────────────────
      - name: chatbot
        image: ghcr.io/integrationproject-groep1/chatbot:latest
        imagePullPolicy: Always
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_VHOST
          value: "/"
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQCHATBOT_USER
        - name: RABBIT_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQCHATBOT_PASS
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_API_KEY
        - name: NVIDIA_MODEL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_MODEL
        - name: NVIDIA_API_URL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_API_URL
        - name: IDENTITY_RPC_QUEUE
          value: "identity.user.lookup.email.request"
        - name: RPC_TIMEOUT
          value: "10.0"
        - name: SESSION_TTL_SECONDS
          value: "3600"
        - name: MCP_SERVERS
          value: "kassa@http://kassa-mcp-service:8004/mcp,crm@http://crm-mcp-service:8008/mcp,monitoring@http://monitoring-mcp-service:8005/mcp,frontend@http://frontend-mcp-service:8006/mcp,facturatie@http://facturatie-mcp-service:8007/mcp"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot
  ports:
    - port: 8000
      targetPort: 8000
