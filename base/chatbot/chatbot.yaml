apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: chatbot
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 5m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:

      # ── Main FastAPI app ───────────────────────────────────────────────────────
      - name: chatbot
        image: ghcr.io/integrationproject-groep1/chatbot:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_VHOST
          value: "/"
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQCHATBOT_USER
        - name: RABBIT_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQCHATBOT_PASS
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_API_KEY
        - name: NVIDIA_MODEL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_MODEL
        - name: NVIDIA_API_URL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: NVIDIA_API_URL
        - name: IDENTITY_RPC_QUEUE
          value: "identity.user.lookup.email.request"
        - name: RPC_TIMEOUT
          value: "10.0"
        - name: SESSION_TTL_SECONDS
          value: "3600"
        - name: MCP_SERVERS
          value: "sessions@http://localhost:8001/mcp,monitoring@http://localhost:8005/mcp,kassa@http://kassa-mcp-service:8004/mcp"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # ── Sessions MCP sidecar (Drupal JSON:API → port 8001) ───────────────────
      - name: sessions-mcp
        image: ghcr.io/integrationproject-groep1/chatbot:latest
        imagePullPolicy: Always
        command: ["python", "/app/src/mcp_servers/sessions.py"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: FRONTEND_BASE_URL
          value: "https://desiderius.me"
        - name: PORT
          value: "8001"
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: tmp-sessions
          mountPath: /tmp

      # ── Monitoring MCP sidecar (Elasticsearch → port 8005) ───────────────────
      - name: monitoring-mcp
        image: ghcr.io/integrationproject-groep1/chatbot:latest
        imagePullPolicy: Always
        command: ["python", "/app/src/mcp_servers/monitoring.py"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        - name: ES_USERNAME
          value: "elastic"
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ELASTIC_PASSWORD
        - name: ES_LOGS_INDEX
          value: "logs-*"
        - name: ES_HEARTBEAT_INDEX
          value: "heartbeats-*"
        - name: PORT
          value: "8005"
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: tmp-monitoring
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
      - name: tmp-sessions
        emptyDir: {}
      - name: tmp-monitoring
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot
  ports:
    - port: 8000
      targetPort: 8000
