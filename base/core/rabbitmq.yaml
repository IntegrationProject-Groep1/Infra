apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-broker
spec:
  replicas: 1
  strategy:
    # Recreate is required because the data PVC uses ReadWriteOnce. A rolling
    # update would leave the old pod holding the volume lock while the new pod
    # tries to mount it, causing a Multi-Attach error. Recreate stops the old
    # pod first, guaranteeing the volume is released before the new pod starts.
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # RabbitMQ node name is rabbit@<hostname>. A stable hostname ensures the
      # node name is deterministic (rabbit@my-rabbit) across pod restarts.
      # Without this, the name changes on each restart and RabbitMQ cannot
      # locate its own persisted Mnesia database on the PVC.
      hostname: my-rabbit
      securityContext:
        runAsNonRoot: true
        # fsGroup: 999 makes all files in mounted volumes owned by GID 999
        # (the rabbitmq group) on pod startup. This lets the non-root container
        # write to the PVC without needing an init container chown.
        fsGroup: 999
      initContainers:
        # Erlang requires the .erlang.cookie to be readable only by its owner
        # (mode 0600). The PVC provisioner may create the file with wider
        # permissions (0644). RabbitMQ refuses to start if the cookie is
        # world-readable, so this init container corrects it before the main
        # container starts. The conditional check avoids failure on first boot
        # when the file does not exist yet.
      - name: fix-cookie-permissions
        image: busybox
        command: ["sh", "-c", "if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 600 /var/lib/rabbitmq/.erlang.cookie; fi"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: rabbit-data
          mountPath: /var/lib/rabbitmq
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: mgmt
        env:
        - name: RABBITMQ_ERLANG_COOKIE
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQ_ERLANG_COOKIE
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQ_DEFAULT_PASS
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: rabbit-data
          mountPath: /var/lib/rabbitmq
        - name: rabbit-config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        - name: rabbit-definitions
          mountPath: /etc/rabbitmq/definitions.json
          subPath: definitions.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: run-rabbitmq
          mountPath: /var/run/rabbitmq
        livenessProbe:
          tcpSocket:
            port: 5672
          # RabbitMQ takes 1–2 minutes to fully initialise on first boot while
          # it sets up the Mnesia database and loads definitions.json. Without
          # a long initial delay the probe kills the pod before it finishes.
          initialDelaySeconds: 120
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: rabbit-data
        persistentVolumeClaim:
          claimName: rabbitmq-data-pvc
      - name: rabbit-config
        configMap:
          name: rabbitmq-config
      - name: rabbit-definitions
        secret:
          secretName: rabbitmq-definitions
      # readOnlyRootFilesystem: true prevents writes to the container filesystem.
      # RabbitMQ still needs writable /tmp and /var/run/rabbitmq for temp files
      # and the AMQP socket. These emptyDir volumes satisfy that requirement
      # without relaxing the root filesystem restriction.
      - name: tmp
        emptyDir: {}
      - name: run-rabbitmq
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: mgmt
      port: 15672
      targetPort: 15672
