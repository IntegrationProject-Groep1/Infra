apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-ingress
  namespace: shift-festival
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: rabbitmq.shiftfestival.be
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq-service
            port:
              number: 15672
