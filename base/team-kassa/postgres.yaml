apiVersion: apps/v1
kind: Deployment
metadata:
  name: kassa-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kassa-db
  template:
    metadata:
      labels:
        app: kassa-db
    spec:
      securityContext:
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:15-alpine
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: tmp
          mountPath: /tmp
        - name: run-postgres
          mountPath: /var/run/postgresql
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h localhost -U $POSTGRES_USER -d postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h localhost -U $POSTGRES_USER -d postgres
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kassa-db-data-pvc-v2
      - name: tmp
        emptyDir: {}
      - name: run-postgres
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kassa-db-service
spec:
  selector:
    app: kassa-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
