apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kassa-ingress
  namespace: shift-festival
  annotations:
    # Optioneel: voeg hier specifieke Nginx instellingen toe
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: kassa.desiderius.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kassa-web-service
            port:
              number: 8069
