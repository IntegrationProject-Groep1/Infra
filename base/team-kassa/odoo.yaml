apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kassa-web
spec:
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 1m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: kassa-web
  template:
    metadata:
      labels:
        app: kassa-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      initContainers:
      - name: setup-config
        image: busybox
        command: ["sh", "-c"]
        args:
        - 'printf "[options]\nadmin_passwd = %s\ndb_host = kassa-db-service\ndb_port = 5432\ndata_dir = /var/lib/odoo\naddons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/17.0,/mnt/extra-addons\n" "$ODOO_MASTER_PASS" > /etc/odoo/odoo.conf'
        env:
        - name: ODOO_MASTER_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ODOO_MASTER_PASS
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: odoo-conf
          mountPath: /etc/odoo
      - name: fetch-addons
        image: alpine/git
        command: ["sh", "-c"]
        args:
        - 'git clone --depth=1 --branch main --filter=blob:none --sparse https://github.com/IntegrationProject-Groep1/Kassa.git /tmp/repo &&
           cd /tmp/repo &&
           git sparse-checkout set addons/kassa_pos_custom &&
           cp -r addons/kassa_pos_custom /mnt/extra-addons/'
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: extra-addons
          mountPath: /mnt/extra-addons
      containers:
      - name: odoo
        image: odoo:17
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        args:
        - "--db_user=$(ODOO_DB_USER)"
        - "--db_password=$(ODOO_DB_PASSWORD)"
        - "--db_host=$(ODOO_DB_HOST)"
        - "--db_port=$(ODOO_DB_PORT)"
        - "--db-filter=^odoo_kassa$"
        - "--proxy-mode"
        - "--log-handler=werkzeug:WARNING"
        ports:
        - containerPort: 8069
          protocol: TCP
        env:
        - name: ODOO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: ODOO_DB
        - name: ODOO_DB_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_USER
        - name: ODOO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_PASSWORD
        - name: HOST
          value: "kassa-db-service"
        - name: PORT
          value: "5432"
        - name: USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: POSTGRES_PASSWORD
        - name: ODOO_DB_HOST
          value: "kassa-db-service"
        - name: ODOO_DB_PORT
          value: "5432"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo
        - name: tmp
          mountPath: /tmp
        - name: odoo-conf
          mountPath: /etc/odoo
          readOnly: true
        - name: extra-addons
          mountPath: /mnt/extra-addons
          readOnly: true
        readinessProbe:
          httpGet:
            path: /web/health
            port: 8069
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: kassa-odoo-data-pvc
      - name: tmp
        emptyDir: {}
      - name: odoo-conf
        emptyDir: {}
      - name: extra-addons
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kassa-web-service
spec:
  selector:
    app: kassa-web
  ports:
    - port: 8069
      targetPort: 8069
  type: ClusterIP