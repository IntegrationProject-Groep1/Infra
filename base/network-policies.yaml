apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kibana
        - podSelector:
            matchLabels:
              app: logstash
        - podSelector:
            matchLabels:
              app: elastic-agent
      ports:
        - port: 9200
        - port: 9300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend-drupal
        - podSelector:
            matchLabels:
              app: facturatie-connector
        - podSelector:
            matchLabels:
              app: kassa-integration
        - podSelector:
            matchLabels:
              app: crm
        - podSelector:
            matchLabels:
              app: identity-service
        - podSelector:
            matchLabels:
              app: planning
        - podSelector:
            matchLabels:
              app: mailing
        - podSelector:
            matchLabels:
              app: logstash
        - podSelector:
            matchLabels:
              app: monitoring-agent
        - podSelector:
            matchLabels:
              app: crm-heartbeat
        - podSelector:
            matchLabels:
              app: facturatie-heartbeat
        - podSelector:
            matchLabels:
              app: frontend-heartbeat
        - podSelector:
            matchLabels:
              app: identity-heartbeat
        - podSelector:
            matchLabels:
              app: kassa-heartbeat
        - podSelector:
            matchLabels:
              app: planning-heartbeat
        - podSelector:
            matchLabels:
              app: monitoring-heartbeat
        - podSelector:
            matchLabels:
              app: chatbot
        - podSelector:
            matchLabels:
              app: chatbot-heartbeat
      ports:
        - port: 5672
        - port: 15672
