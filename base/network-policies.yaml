apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-db
spec:
  podSelector:
    matchLabels:
      app: frontend-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend-drupal
      ports:
        - port: 3306
---
