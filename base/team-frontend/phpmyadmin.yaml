apiVersion: v1
kind: ConfigMap
metadata:
  name: phpmyadmin-config
data:
  config.user.inc.php: |
    <?php
    $cfg['blowfish_secret'] = 'ShiftFestival-pma-32char-secret!';
    $cfg['ForceSSL'] = false;
    $cfg['Servers'][1]['AllowNoPassword'] = false;
    ini_set('session.cookie_secure', '0');
    ini_set('session.cookie_samesite', 'Lax');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-phpmyadmin
  template:
    metadata:
      labels:
        app: frontend-phpmyadmin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        fsGroup: 33
      containers:
      - name: phpmyadmin
        image: phpmyadmin:5.2-apache
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 80
        env:
        - name: PMA_HOST
          value: frontend-db-service
        - name: PMA_PORT
          value: "3306"
        - name: UPLOAD_LIMIT
          value: "64M"
        - name: PMA_BLOWFISH_SECRET
          value: "ShiftFestival-pma-32char-secret!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: pma-config
          mountPath: /etc/phpmyadmin/config.user.inc.php
          subPath: config.user.inc.php
      volumes:
      - name: pma-config
        configMap:
          name: phpmyadmin-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-phpmyadmin-service
spec:
  type: NodePort
  selector:
    app: frontend-phpmyadmin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30022
