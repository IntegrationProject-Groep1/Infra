apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-drupal
spec:
  progressDeadlineSeconds: 180
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 3m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend-drupal
  template:
    metadata:
      labels:
        app: frontend-drupal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: drupal
        image: ghcr.io/integrationproject-groep1/ip-groep1-frontend:latest
        imagePullPolicy: Always
        command:
          - sh
          - '-c'
        args:
          - >-
            mkdir -p /var/www/html/sites/default/files/config_sync &&
            (sleep 15
            && timeout 90 /opt/drupal/vendor/bin/drush --root=/var/www/html en
            rabbitmq_sender rabbitmq_receiver registration_form session_enrollment
            session_management company_invite qr_code jsonapi basic_auth --yes
            && timeout 60 /opt/drupal/vendor/bin/drush --root=/var/www/html updb --yes
            && timeout 60 /opt/drupal/vendor/bin/drush --root=/var/www/html cr
            || true) & exec apache2-foreground
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: DRUPAL_DB_HOST
          value: "frontend-db-service"
        - name: DRUPAL_DB_PORT
          value: "3306"
        - name: DRUPAL_DB_NAME
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_NAME
        - name: DRUPAL_DB_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_USER
        - name: DRUPAL_DB_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_PASS
        - name: DRUPAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_PASS
        - name: MARIADB_HOST
          value: "frontend-db-service"
        - name: MARIADB_DATABASE
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_NAME
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_USER
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_DB_PASS
        - name: DRUPAL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: DRUPAL_BASE_URL
        - name: DRUPAL_REVERSE_PROXY
          value: "true"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_VHOST
          value: "/"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFRONTEND_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFRONTEND_PASS
        - name: RABBITMQFRONTEND_PREFIX
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFRONTEND_PREFIX
        - name: REGISTRATION_REQUIRE_RABBITMQ_SYNC
          value: "0"
        - name: PLANNING_API_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: PLANNING_API_TOKEN_SECRET
        - name: PLANNING_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: PLANNING_SERVICE_URL
        - name: TEAMS_WEBHOOK_FRONTEND
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: TEAMS_WEBHOOK_FRONTEND
        - name: AZURE_CLIENT_ID
          value: "c28b3a31-2840-4212-aed3-5f3da8bdf1a1"
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: AZURE_CLIENT_SECRET
        - name: AZURE_REDIRECT_URI
          value: "https://desiderius.me/auth/microsoft/callback"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "2000m"
        volumeMounts:
        - name: drupal-files
          mountPath: /var/www/html/sites/default/files
        - name: drupal-settings
          mountPath: /var/www/html/sites/default/settings.php
          subPath: settings.php
        - name: rabbitmq-sender-services
          mountPath: /var/www/html/modules/custom/rabbitmq_sender/rabbitmq_sender.services.yml
          subPath: rabbitmq_sender.services.yml
        - name: session-management-services
          mountPath: /opt/drupal/web/modules/custom/session_management/session_management.services.yml
          subPath: session_management.services.yml
        - name: apache-run
          mountPath: /var/run/apache2
        - name: apache-log
          mountPath: /var/log/apache2
        - name: apache-lock
          mountPath: /var/lock/apache2
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: drupal-files
        persistentVolumeClaim:
          claimName: frontend-drupal-files-pvc
      - name: drupal-settings
        configMap:
          name: frontend-drupal-settings
      - name: rabbitmq-sender-services
        configMap:
          name: frontend-rabbitmq-sender-services
      - name: session-management-services
        configMap:
          name: frontend-session-management-services
      - name: apache-run
        emptyDir: {}
      - name: apache-log
        emptyDir: {}
      - name: apache-lock
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-drupal-service
spec:
  selector:
    app: frontend-drupal
  ports:
    - port: 80
      targetPort: 80
