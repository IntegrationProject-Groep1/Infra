# =============================================================================
# configmaps.yaml
# ShiftFestival — Infra Team
#
# Contains all ConfigMaps for the shift-festival namespace:
#   - rabbitmq-config          — RabbitMQ broker settings
#   - kassa-nginx-config       — Nginx reverse proxy for Odoo (blocks DB manager)
#   - frontend-nginx-config    — Nginx reverse proxy for Drupal
#   - frontend-drupal-settings — Drupal settings.php (DB + trusted hosts + proxy)
#   - facturatie-nginx-config  — Nginx reverse proxy for FossBilling
#   - frontend-rabbitmq-sender-services — Drupal service definitions for RabbitMQ
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    # Allow the default 'guest' user to connect from non-loopback addresses.
    # Required because RabbitMQ clients connect from other pods (not localhost).
    loopback_users.guest = false
    listeners.tcp.default = 5672
    management.tcp.port = 15672
    # Load vhosts, users, permissions, and queue bindings from the
    # rabbitmq-definitions secret on startup. This replaces manual setup
    # through the management UI and makes the configuration reproducible.
    load_definitions = /etc/rabbitmq/definitions.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kassa-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        # Block access to the Odoo database manager — publicly accessible and dangerous
        location /web/database/manager {
            deny all;
            return 403;
        }
        location / {
            proxy_pass             http://kassa-web-service:8069;
            proxy_set_header       Host $http_host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto https;
            proxy_set_header       X-Forwarded-Host $http_host;
            proxy_redirect         off;
            proxy_buffering        off;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        location / {
            proxy_pass         http://frontend-drupal-service:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Port 443;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-drupal-settings
data:
  settings.php: |
    <?php

    /**
     * Drupal runtime configuration.
     *
     * Credentials are read from Kubernetes environment variables injected from
     * shift-secrets by the frontend-drupal Deployment.
     */

    $databases['default']['default'] = [
      'driver'    => 'mysql',
      'database'  => getenv('DRUPAL_DB_NAME') ?: 'drupal',
      'username'  => getenv('DRUPAL_DB_USER') ?: 'drupal_user',
      'password'  => getenv('DRUPAL_DB_PASSWORD') ?: getenv('DRUPAL_DB_PASS') ?: '',
      'host'      => getenv('DRUPAL_DB_HOST') ?: 'frontend-db-service',
      'port'      => getenv('DRUPAL_DB_PORT') ?: '3306',
      'prefix'    => '',
      'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
      'autoload'  => 'core/modules/mysql/src/Driver/Database/mysql/',
    ];

    // Secondary connection used by Drupal modules that read planning data.
    // Reuses the same credentials and host as the default connection but
    // targets a different database (PLANNING_DB_NAME).
    $databases['planning']['default'] = [
      'driver'    => 'mysql',
      'database'  => getenv('PLANNING_DB_NAME') ?: 'planning',
      'username'  => getenv('DRUPAL_DB_USER') ?: 'drupal_user',
      'password'  => getenv('DRUPAL_DB_PASSWORD') ?: getenv('DRUPAL_DB_PASS') ?: '',
      'host'      => getenv('DRUPAL_DB_HOST') ?: 'frontend-db-service',
      'port'      => getenv('DRUPAL_DB_PORT') ?: '3306',
      'prefix'    => '',
      'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
      'autoload'  => 'core/modules/mysql/src/Driver/Database/mysql/',
    ];

    $settings['hash_salt'] = getenv('DRUPAL_HASH_SALT') ?: 'local-dev-hash-salt-event-platform-2526';
    $settings['update_free_access'] = FALSE;
    $settings['config_sync_directory'] = 'sites/default/files/config_sync';
    $settings['file_temp_path'] = '/tmp';

    $settings['trusted_host_patterns'] = [
      '^localhost$',
      '^localhost(:[0-9]+)?$',
      '^127\.0\.0\.1(:[0-9]+)?$',
      '^integrationproject-2526s2-dag01\.westeurope\.cloudapp\.azure\.com(:[0-9]+)?$',
      '^desiderius\.me$',
      '^.*\.desiderius\.me$',
      '^.*$',
    ];

    if (getenv('DRUPAL_REVERSE_PROXY') === 'true') {
      $settings['reverse_proxy'] = TRUE;
      $settings['reverse_proxy_addresses'] = [$_SERVER['REMOTE_ADDR']];
      // Trust X-Forwarded-For, X-Forwarded-Host, and X-Forwarded-Proto from the
      // Cloudflare/Nginx proxy chain. X-Forwarded-Port is intentionally excluded
      // — trusting it causes Drupal to generate absolute URLs with :443 appended,
      // breaking links and form actions on the public site.
      $settings['reverse_proxy_trusted_headers'] = \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_FOR | \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_HOST | \Symfony\Component\HttpFoundation\Request::HEADER_X_FORWARDED_PROTO;
      $settings['reverse_proxy_proto_header'] = 'X-Forwarded-Proto';
      $settings['reverse_proxy_host_header'] = 'X-Forwarded-Host';

      // FORCE HTTPS and Port 443
      $_SERVER['SERVER_PORT'] = 443;
      $_SERVER['HTTPS'] = 'on';

      // Hard-override the global base_url variable
      if ($base_url_env = getenv('DRUPAL_BASE_URL')) {
        $base_url = $base_url_env;
        $settings['base_url'] = $base_url_env;
      }
    }

    ini_set('memory_limit', '512M');
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: facturatie-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        location / {
            proxy_pass         http://facturatie-app-service:80;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # FossBilling emits absolute HTTPS redirects internally. This rule
            # rewrites them back to HTTP so the proxy can forward them without
            # creating a redirect loop between the app and the Cloudflare edge.
            proxy_redirect     https:// http://;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-rabbitmq-sender-services
data:
  rabbitmq_sender.services.yml: |
    services:
      rabbitmq_sender.session_create_request_sender:
        class: Drupal\rabbitmq_sender\SessionCreateRequestSender

      rabbitmq_sender.session_update_request_sender:
        class: Drupal\rabbitmq_sender\SessionUpdateRequestSender

      rabbitmq_sender.session_delete_request_sender:
        class: Drupal\rabbitmq_sender\SessionDeleteRequestSender

      rabbitmq_sender.session_view_request_sender:
        class: Drupal\rabbitmq_sender\SessionViewRequestSender

      rabbitmq_sender.event_ended_sender:
        class: Drupal\rabbitmq_sender\EventEndedSender

      rabbitmq_sender.new_registration_sender:
        class: Drupal\rabbitmq_sender\NewRegistrationSender

      rabbitmq_sender.company_registration_sender:
        class: Drupal\rabbitmq_sender\CompanyRegistrationSender

      rabbitmq_sender.calendar_invite_sender:
        class: Drupal\rabbitmq_sender\CalendarInviteSender

      rabbitmq_sender.user_created_sender:
        class: Drupal\rabbitmq_sender\UserCreatedSender

      rabbitmq_sender.user_updated_sender:
        class: Drupal\rabbitmq_sender\UserUpdatedSender

      rabbitmq_sender.user_checkin_sender:
        class: Drupal\rabbitmq_sender\UserCheckinSender

      rabbitmq_sender.user_registered_sender:
        class: Drupal\rabbitmq_sender\UserRegisteredSender

      rabbitmq_sender.user_unregistered_sender:
        class: Drupal\rabbitmq_sender\UserUnregisteredSender
