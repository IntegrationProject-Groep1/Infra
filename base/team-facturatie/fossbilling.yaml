apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fossbilling-app
spec:
  replicas: 1
  strategy:
    canary:
      steps:
      - setWeight: 100
      - pause: {duration: 5m}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fossbilling-app
  template:
    metadata:
      labels:
        app: fossbilling-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        fsGroup: 33
      initContainers:
      - name: copy-app-files
        image: fossbilling/fossbilling:latest
        command:
          - sh
          - -c
          - |
            if [ -z "$(ls -A /mnt/html)" ]; then
              cp -a /var/www/html/. /mnt/html/
              echo "App files copied to PVC."
            else
              echo "App files already present, skipping copy."
            fi
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: foss-html
          mountPath: /mnt/html
      - name: init-data-dirs
        image: busybox
        command: ["sh", "-c", "mkdir -p /data/cache /data/log /data/uploads && chmod -R 775 /data/cache /data/log && mkdir -p /uploads && chmod -R 775 /uploads"]
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: foss-data
          mountPath: /data
        - name: foss-uploads
          mountPath: /uploads
      containers:
      - name: fossbilling
        image: fossbilling/fossbilling:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: DB_HOST
          value: "facturatie-db-service"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_PASS
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: foss-html
          mountPath: /var/www/html
        - name: foss-data
          mountPath: /var/www/html/data
        - name: foss-uploads
          mountPath: /var/www/html/data/uploads
        - name: apache-run
          mountPath: /var/run/apache2
        - name: apache-log
          mountPath: /var/log/apache2
        - name: apache-lock
          mountPath: /var/lock/apache2
        - name: tmp
          mountPath: /tmp
        - name: apache-proxy-config
          mountPath: /etc/apache2/conf-enabled/trusted-proxy.conf
          subPath: trusted-proxy.conf
          readOnly: true
      volumes:
      - name: foss-html
        persistentVolumeClaim:
          claimName: fossbilling-html-pvc
      - name: foss-data
        persistentVolumeClaim:
          claimName: fossbilling-data-pvc
      - name: foss-uploads
        persistentVolumeClaim:
          claimName: fossbilling-uploads-pvc
      - name: apache-run
        emptyDir: {}
      - name: apache-log
        emptyDir: {}
      - name: apache-lock
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: apache-proxy-config
        configMap:
          name: fossbilling-apache-config
---
apiVersion: v1
kind: Service
metadata:
  name: facturatie-app-service
spec:
  selector:
    app: fossbilling-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facturatie-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facturatie-connector
  template:
    metadata:
      labels:
        app: facturatie-connector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: connector
        image: ghcr.io/integrationproject-groep1/facturatie:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: DB_HOST
          value: "facturatie-db-service"
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_NAME
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: FOSSBILLING_DB_PASS
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFACTURATIE_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFACTURATIE_PASS
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: RABBITMQFACTURATIE_PASS
        - name: BILLING_API_URL
          value: "http://facturatie-app-service/api"
        - name: BILLING_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: BILLING_API_TOKEN
        - name: TEAMS_WEBHOOK_FACTURATIE
          valueFrom:
            secretKeyRef:
              name: shift-secrets
              key: TEAMS_WEBHOOK_FACTURATIE
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
