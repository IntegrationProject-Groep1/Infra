name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"] # Must match the 'name' of your CI workflow exactly
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # Only deploy if the CI Pipeline was successful
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Image Tag
        id: vars
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "dev" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Lowercase repo name
        id: repo_name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            set -euo pipefail
            cd shiftfestival
            
            # Update infra manifests
            git pull origin main
            
            # Determine overlay based on the branch of the team repo
            if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
              OVERLAY="overlays/prod"
            else
              OVERLAY="overlays/dev"
            fi
            
            echo "Deploying using $OVERLAY..."
            kubectl apply -k $OVERLAY

