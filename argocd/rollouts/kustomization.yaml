apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml

patches:
  - path: patch-lease.yaml
    target:
      kind: Deployment
      name: argo-rollouts
