apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shift-festival-prod
  namespace: argocd
  annotations:
    # ---------------------------------------------------------------------------
    # ArgoCD Image Updater — image tracking configuration
    #
    # Each team service is tracked by its :latest tag using the "digest" strategy.
    # "digest" means: watch for a new SHA digest pushed to the same tag name.
    # This is necessary because teams push new builds to :latest rather than
    # versioned tags — the tag name never changes but the underlying image does.
    #
    # allow-tags: regexp:^latest$ restricts tracking to exactly the :latest tag.
    # This prevents accidental deployment of :dev or any other tag that teams
    # may push to the same registry.
    #
    # When Image Updater detects a new digest it commits the updated image
    # reference to this repo (write-back-method: git) which then triggers an
    # ArgoCD sync. The commit is written to the main branch.
    # ---------------------------------------------------------------------------
    argocd-image-updater.argoproj.io/image-list: >-
      frontend=ghcr.io/integrationproject-groep1/ip-groep1-frontend:latest,
      kassa=ghcr.io/integrationproject-groep1/kassa:latest,
      facturatie=ghcr.io/integrationproject-groep1/facturatie:latest,
      crm=ghcr.io/integrationproject-groep1/crm:latest,
      planning=ghcr.io/integrationproject-groep1/planning:latest,
      identity=ghcr.io/integrationproject-groep1/identity-service:latest,
      heartbeat=ghcr.io/integrationproject-groep1/heartbeat:latest,
      mailing=ghcr.io/integrationproject-groep1/mailing:latest,
      chatbot=ghcr.io/integrationproject-groep1/chatbot:latest,
      monitoring=ghcr.io/integrationproject-groep1/monitoring:latest,
      frontend-mcp=ghcr.io/integrationproject-groep1/ip-groep1-frontend-mcp:latest,
      monitoring-mcp=ghcr.io/integrationproject-groep1/monitoring-mcp:latest,
      facturatie-mcp=ghcr.io/integrationproject-groep1/facturatie-mcp:latest,
      crm-mcp=ghcr.io/integrationproject-groep1/crm-mcp:latest,
      kassa-mcp=ghcr.io/integrationproject-groep1/kassa-mcp:latest,
      kassa-odoo=ghcr.io/integrationproject-groep1/kassa:odoo-latest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/frontend.kustomize.image-name: ghcr.io/integrationproject-groep1/ip-groep1-frontend
    argocd-image-updater.argoproj.io/kassa.update-strategy: digest
    argocd-image-updater.argoproj.io/kassa.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/kassa.kustomize.image-name: ghcr.io/integrationproject-groep1/kassa
    argocd-image-updater.argoproj.io/facturatie.update-strategy: digest
    argocd-image-updater.argoproj.io/facturatie.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/facturatie.kustomize.image-name: ghcr.io/integrationproject-groep1/facturatie
    argocd-image-updater.argoproj.io/crm.update-strategy: digest
    argocd-image-updater.argoproj.io/crm.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/crm.kustomize.image-name: ghcr.io/integrationproject-groep1/crm
    argocd-image-updater.argoproj.io/planning.update-strategy: digest
    argocd-image-updater.argoproj.io/planning.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/planning.kustomize.image-name: ghcr.io/integrationproject-groep1/planning
    argocd-image-updater.argoproj.io/identity.update-strategy: digest
    argocd-image-updater.argoproj.io/identity.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/identity.kustomize.image-name: ghcr.io/integrationproject-groep1/identity-service
    argocd-image-updater.argoproj.io/heartbeat.update-strategy: digest
    argocd-image-updater.argoproj.io/heartbeat.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/heartbeat.kustomize.image-name: ghcr.io/integrationproject-groep1/heartbeat
    argocd-image-updater.argoproj.io/mailing.update-strategy: digest
    argocd-image-updater.argoproj.io/mailing.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/mailing.kustomize.image-name: ghcr.io/integrationproject-groep1/mailing
    argocd-image-updater.argoproj.io/chatbot.update-strategy: digest
    argocd-image-updater.argoproj.io/chatbot.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/chatbot.kustomize.image-name: ghcr.io/integrationproject-groep1/chatbot
    argocd-image-updater.argoproj.io/monitoring.update-strategy: digest
    argocd-image-updater.argoproj.io/monitoring.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/monitoring.kustomize.image-name: ghcr.io/integrationproject-groep1/monitoring
    argocd-image-updater.argoproj.io/frontend-mcp.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend-mcp.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/frontend-mcp.kustomize.image-name: ghcr.io/integrationproject-groep1/ip-groep1-frontend-mcp
    argocd-image-updater.argoproj.io/monitoring-mcp.update-strategy: digest
    argocd-image-updater.argoproj.io/monitoring-mcp.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/monitoring-mcp.kustomize.image-name: ghcr.io/integrationproject-groep1/monitoring-mcp
    argocd-image-updater.argoproj.io/facturatie-mcp.update-strategy: digest
    argocd-image-updater.argoproj.io/facturatie-mcp.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/facturatie-mcp.kustomize.image-name: ghcr.io/integrationproject-groep1/facturatie-mcp
    argocd-image-updater.argoproj.io/crm-mcp.update-strategy: digest
    argocd-image-updater.argoproj.io/crm-mcp.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/crm-mcp.kustomize.image-name: ghcr.io/integrationproject-groep1/crm-mcp
    argocd-image-updater.argoproj.io/kassa-mcp.update-strategy: digest
    argocd-image-updater.argoproj.io/kassa-mcp.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/kassa-mcp.kustomize.image-name: ghcr.io/integrationproject-groep1/kassa-mcp
    argocd-image-updater.argoproj.io/kassa-odoo.update-strategy: digest
    argocd-image-updater.argoproj.io/kassa-odoo.allow-tags: regexp:^odoo-latest$
    argocd-image-updater.argoproj.io/kassa-odoo.kustomize.image-name: ghcr.io/integrationproject-groep1/kassa-odoo
    # write-back-method: git commits updated image digests back to this repo so
    # ArgoCD can detect the change and trigger a sync. The git-creds secret holds
    # a GitHub PAT with repo write access (created in the argocd namespace).
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
  # The resources-finalizer ensures ArgoCD removes all managed resources from the
  # cluster when this Application object is deleted, preventing orphaned resources.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/integrationproject-groep1/Infra.git
    targetRevision: main
    # path: . means ArgoCD runs kustomize build at the repo root, which produces
    # the full production manifest set via the root kustomization.yaml.
    path: .
    kustomize:
      # images: [] is intentionally empty here — ArgoCD Image Updater manages
      # image overrides by committing them directly to kustomization.yaml in Git.
      # ArgoCD then reads those committed overrides on the next sync.
      images: []
  destination:
    server: https://kubernetes.default.svc
    namespace: shift-festival
  syncPolicy:
    automated:
      # prune: true removes cluster resources that no longer exist in Git.
      # Required for proper GitOps hygiene — without this, deleted manifests
      # leave orphaned Deployments, Services, etc. running in the cluster.
      prune: true
      # selfHeal: true reverts any manual kubectl changes back to the Git state.
      # Git is the single source of truth; direct cluster edits are not allowed.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is required to avoid "field is owned by another manager"
      # conflicts when HPA and ArgoCD both manage fields on the same resource.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # shift-secrets is bootstrapped manually via scripts/create-secret.sh from
    # the .env file on the VM. ArgoCD does not manage secret values — they are
    # never committed to Git. Without this entry, ArgoCD would continuously
    # report OutOfSync and attempt to reset the Secret data to its Git state
    # (which is empty), effectively wiping all credentials on every sync.
    - group: ""
      kind: Secret
      name: shift-secrets
      jsonPointers:
        - /data
    # HPA exclusively owns spec.replicas on HPA-managed Rollouts. If ArgoCD
    # tracked this field, selfHeal would overwrite HPA's scaling decisions with
    # whatever value (or absence of value) is in Git on every sync cycle,
    # causing a continuous conflict between ArgoCD and the HPA controller.
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
