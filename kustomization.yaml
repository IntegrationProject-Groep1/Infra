apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Root entry point — deploys prod + Keel together.
# Kainy will update the CI/CD pipeline to call:
#   kubectl apply -k overlays/prod && kubectl apply -k keel   (push to main)
#   kubectl apply -k overlays/dev                             (push to dev)
# After that update, this root file can be removed.
resources:
  - overlays/prod
  - keel
