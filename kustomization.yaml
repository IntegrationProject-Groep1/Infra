apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base
  - argocd/rollouts

images:
  - name: ghcr.io/integrationproject-groep1/ip-groep1-frontend
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/kassa
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/facturatie
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/crm
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/planning
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/identity-service
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/heartbeat
    newTag: latest
  - name: ghcr.io/integrationproject-groep1/mailing
    newTag: latest

patches:
  - target:
      kind: Rollout
      name: frontend-drupal
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
